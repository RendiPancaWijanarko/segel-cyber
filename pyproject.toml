[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "segel"
version = "0.1.0"
description = "SEGEL - Sistem Edar Gelar Elektronik Lapis-ganda: Secure configuration and release distribution platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "SEGEL Team"},
]

dependencies = [
    "cryptography>=44.0.0",
    "pydantic>=2.10.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.18",
    "cbor2>=5.6.0",
    "qrcode[pil]>=8.0",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.100.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
    "httpx>=0.28.0",
    "psutil>=6.0.0",
]
ai = [
    "httpx>=0.28.0",
]

[project.scripts]
segel-receiver = "receiver.cli:main"
segel-approver = "approver.cli:main"
segel-witness = "witness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "adversarial: marks adversarial/security tests",
    "integration: marks integration tests",
    "slow: marks slow tests",
    "gap: marks hardening gap tests (Phase C red tests)",
    "live_ai: marks live AI tests requiring local Ollama",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T10", "ISC", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA"]
ignore = ["TC001", "TC002", "TC003", "ARG001", "ARG002"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501", "F", "I", "W", "B", "SIM", "C4", "PT", "ARG", "SLF001", "ERA", "N", "PTH"]
"scripts/**" = ["S", "E501", "F", "I", "W", "B", "T201", "C4", "SLF001", "SIM", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["src/segel_core"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

